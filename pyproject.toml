[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftdrop"
version = "0.2.0"
description = "Local file conversions with a drag-and-Shift radial menu"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=11.3,<14",
  "pillow-heif>=1.0,<2",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "striprtf>=0.0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.15,<7"]

[project.scripts]
shiftdrop = "shiftdrop.app:main"

[project.urls]
Repository = "https://github.com/zepredos/ShiftDrop"
Issues = "https://github.com/zepredos/ShiftDrop/issues"
Documentation = "https://github.com/zepredos/ShiftDrop#readme"

[tool.setuptools.packages.find]
where = ["portable"]

[tool.pytest.ini_options]
testpaths = ["portable/tests"]
